<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" role="img" aria-label="Storage: project files are stored by content in objects; checkpoints point to them; secrets are never saved">
<title>Storage: project files are stored by content in objects; checkpoints point to them; secrets are never saved</title>
<style>svg{--fg:#e6edf3;--muted:#9198a1;--box:#161b22;--line:#3d444d;--acc:#e8916f;--accbg:#2e1d16;--ok:#3fb950;--okbg:#11261a;--bad:#f85149;--badbg:#2d1517;--page:#0d1117}
