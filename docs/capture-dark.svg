<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="How edits and shell commands are protected">
<title>How edits and shell commands are protected</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="ah " fill="#C0B69F"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="ah acc" fill="#F3E8CD"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="ah bad" fill="#CAB78E"/></marker></defs>
<rect width="100%" height="100%" fill="#090909"/>
<text x="40" y="28" text-anchor="start" class="lane" font-family="Georgia,'Times New Roman',serif" font-size="11px" font-weight="600" letter-spacing=".09em" fill="#C0B69F">FILE EDITS</text>
<rect x="40" y="42" width="170" height="60" rx="2" class="box " fill="#11100E" stroke="#665C47" stroke-width="1"/><text x="125" y="69" text-anchor="middle" class="ttl " font-family="Georgia,'Times New Roman',serif" font-size="13px" font-weight="600" fill="#F3E8CD">Agent edits a file</text><text x="125" y="86" text-anchor="middle" class="sub" font-family="Georgia,'Times New Roman',serif" font-size="11.5px" fill="#C0B69F">Edit, Write, MultiEdit</text>
<path d="M212 72H247" class="arr " stroke="#C0B69F" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="250" y="42" width="170" height="60" rx="2" class="box acc" fill="#1C1913" stroke="#F3E8CD" stroke-width="1"/><text x="335" y="69" text-anchor="middle" class="ttl acc" font-family="Georgia,'Times New Roman',serif" font-size="13px" font-weight="600" fill="#F3E8CD">Save its content first</text><text x="335" y="86" text-anchor="middle" class="sub" font-family="Georgia,'Times New Roman',serif" font-size="11.5px" fill="#C0B69F">once per file per turn</text>
<path d="M422 72H457" class="arr " stroke="#C0B69F" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="460" y="42" width="170" height="60" rx="2" class="box " fill="#11100E" stroke="#665C47" stroke-width="1"/><text x="545" y="69" text-anchor="middle" class="ttl " font-family="Georgia,'Times New Roman',serif" font-size="13px" font-weight="600" fill="#F3E8CD">Permission, then edit</text><text x="545" y="86" text-anchor="middle" class="sub" font-family="Georgia,'Times New Roman',serif" font-size="11.5px" fill="#C0B69F">the edit runs as usual</text>
<path d="M632 72H667" class="arr " stroke="#C0B69F" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="670" y="42" width="170" height="60" rx="2" class="box ok" fill="#1C1913" stroke="#E4D4AD" stroke-width="1"/><text x="755" y="69" text-anchor="middle" class="ttl ok" font-family="Georgia,'Times New Roman',serif" font-size="13px" font-weight="600" fill="#E4D4AD">Protected</text><text x="755" y="86" text-anchor="middle" class="sub" font-family="Georgia,'Times New Roman',serif" font-size="11.5px" fill="#C0B69F">a rollback restores it</text>
<path d="M545 103V129" class="arr " stroke="#C0B69F" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="553" y="120" text-anchor="start" class="lbl" font-family="Georgia,'Times New Roman',serif" font-size="11px" fill="#C0B69F">refused</text>
<rect x="460" y="132" width="170" height="34" rx="2" class="box " fill="#11100E" stroke="#665C47" stroke-width="1"/><text x="545" y="153.5" text-anchor="middle" class="ttl " font-family="Georgia,'Times New Roman',serif" font-size="13px" font-weight="600" fill="#F3E8CD">Save dropped</text>
<text x="40" y="206" text-anchor="start" class="lane" font-family="Georgia,'Times New Roman',serif" font-size="11px" font-weight="600" letter-spacing=".09em" fill="#C0B69F">SHELL COMMANDS</text>
<rect x="40" y="220" width="170" height="60" rx="2" class="box " fill="#11100E" stroke="#665C47" stroke-width="1"/><text x="125" y="247" text-anchor="middle" class="ttl " font-family="Georgia,'Times New Roman',serif" font-size="13px" font-weight="600" fill="#F3E8CD">Agent runs a command</text><text x="125" y="264" text-anchor="middle" class="sub" font-family="Georgia,'Times New Roman',serif" font-size="11.5px" fill="#C0B69F">Bash or PowerShell</text>
<path d="M212 250H247" class="arr " stroke="#C0B69F" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="250" y="220" width="170" height="60" rx="2" class="box " fill="#11100E" stroke="#665C47" stroke-width="1"/><text x="335" y="247" text-anchor="middle" class="ttl " font-family="Georgia,'Times New Roman',serif" font-size="13px" font-weight="600" fill="#F3E8CD">Looks destructive?</text><text x="335" y="264" text-anchor="middle" class="sub" font-family="Georgia,'Times New Roman',serif" font-size="11.5px" fill="#C0B69F">rm, mv, git reset, sed -i</text>
<path d="M422 250H457" class="arr " stroke="#C0B69F" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="460" y="220" width="170" height="60" rx="2" class="box acc" fill="#1C1913" stroke="#F3E8CD" stroke-width="1"/><text x="545" y="247" text-anchor="middle" class="ttl acc" font-family="Georgia,'Times New Roman',serif" font-size="13px" font-weight="600" fill="#F3E8CD">Snapshot first</text><text x="545" y="264" text-anchor="middle" class="sub" font-family="Georgia,'Times New Roman',serif" font-size="11.5px" fill="#C0B69F">bounded: 5,000 files</text>
<path d="M632 250H667" class="arr " stroke="#C0B69F" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="670" y="220" width="170" height="60" rx="2" class="box " fill="#11100E" stroke="#665C47" stroke-width="1"/><text x="755" y="247" text-anchor="middle" class="ttl " font-family="Georgia,'Times New Roman',serif" font-size="13px" font-weight="600" fill="#F3E8CD">Command runs</text><text x="755" y="264" text-anchor="middle" class="sub" font-family="Georgia,'Times New Roman',serif" font-size="11.5px" fill="#C0B69F">shown above the prompt</text>
<text x="438" y="241" text-anchor="middle" class="lbl" font-family="Georgia,'Times New Roman',serif" font-size="11px" fill="#C0B69F">yes</text>
<path d="M335 281C335 322 755 322 755 284" class="arr " stroke="#C0B69F" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="545" y="325" text-anchor="middle" class="lbl" font-family="Georgia,'Times New Roman',serif" font-size="11px" fill="#C0B69F">no</text>
</svg>
