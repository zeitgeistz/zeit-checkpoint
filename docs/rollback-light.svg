<svg xmlns="http://www.w3.org/2000/svg" width="920" height="206" viewBox="0 0 920 206" role="img" aria-label="Rollback: preview, confirm with the token, re-check, save an undo point, then write">
<title>Rollback: preview, confirm with the token, re-check, save an undo point, then write</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="ah " fill="#C0B69F"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="ah acc" fill="#F3E8CD"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="ah bad" fill="#CAB78E"/></marker></defs>
<rect width="100%" height="100%" fill="#090909"/>
<rect x="30" y="36" width="148" height="64" rx="2" class="box " fill="#11100E" stroke="#665C47" stroke-width="1"/><text x="104" y="65" text-anchor="middle" class="ttl " font-family="Georgia,'Times New Roman',serif" font-size="13px" font-weight="600" fill="#F3E8CD">Preview</text><text x="104" y="82" text-anchor="middle" class="sub" font-family="Georgia,'Times New Roman',serif" font-size="11.5px" fill="#C0B69F">nothing written yet</text>
<path d="M180 68H205" class="arr " stroke="#C0B69F" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="208" y="36" width="148" height="64" rx="2" class="box " fill="#11100E" stroke="#665C47" stroke-width="1"/><text x="282" y="65" text-anchor="middle" class="ttl " font-family="Georgia,'Times New Roman',serif" font-size="13px" font-weight="600" fill="#F3E8CD">Confirm</text><text x="282" y="82" text-anchor="middle" class="sub mono" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Consolas,Menlo,monospace" font-size="11.5px" fill="#C0B69F">--confirm &lt;token&gt;</text>
<path d="M358 68H383" class="arr " stroke="#C0B69F" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="386" y="36" width="148" height="64" rx="2" class="box " fill="#11100E" stroke="#665C47" stroke-width="1"/><text x="460" y="65" text-anchor="middle" class="ttl " font-family="Georgia,'Times New Roman',serif" font-size="13px" font-weight="600" fill="#F3E8CD">Re-check files</text><text x="460" y="82" text-anchor="middle" class="sub" font-family="Georgia,'Times New Roman',serif" font-size="11.5px" fill="#C0B69F">same as the preview?</text>
<path d="M536 68H561" class="arr " stroke="#C0B69F" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="564" y="36" width="148" height="64" rx="2" class="box acc" fill="#1C1913" stroke="#F3E8CD" stroke-width="1"/><text x="638" y="65" text-anchor="middle" class="ttl acc" font-family="Georgia,'Times New Roman',serif" font-size="13px" font-weight="600" fill="#F3E8CD">Save undo point</text><text x="638" y="82" text-anchor="middle" class="sub" font-family="Georgia,'Times New Roman',serif" font-size="11.5px" fill="#C0B69F">of the files it changes</text>
<path d="M714 68H739" class="arr " stroke="#C0B69F" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="742" y="36" width="148" height="64" rx="2" class="box ok" fill="#1C1913" stroke="#E4D4AD" stroke-width="1"/><text x="816" y="65" text-anchor="middle" class="ttl ok" font-family="Georgia,'Times New Roman',serif" font-size="13px" font-weight="600" fill="#E4D4AD">Write files</text><text x="816" y="82" text-anchor="middle" class="sub" font-family="Georgia,'Times New Roman',serif" font-size="11.5px" fill="#C0B69F">temp file, then rename</text>
<text x="549" y="27" text-anchor="middle" class="lbl" font-family="Georgia,'Times New Roman',serif" font-size="11px" fill="#C0B69F">unchanged</text>
<path d="M460 101V139" class="arr bad" stroke="#CAB78E" stroke-width="1.4" fill="none" marker-end="url(#ab)"/>
<text x="468" y="124" text-anchor="start" class="lbl bad" font-family="Georgia,'Times New Roman',serif" font-size="11px" fill="#CAB78E">changed</text>
<rect x="386" y="142" width="148" height="46" rx="2" class="box bad" fill="#211B12" stroke="#CAB78E" stroke-width="1"/><text x="460" y="162" text-anchor="middle" class="ttl bad" font-family="Georgia,'Times New Roman',serif" font-size="13px" font-weight="600" fill="#CAB78E">Stop</text><text x="460" y="179" text-anchor="middle" class="sub" font-family="Georgia,'Times New Roman',serif" font-size="11.5px" fill="#C0B69F">and show a fresh preview</text>
<path d="M385 165H104V103" class="arr " stroke="#C0B69F" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="244" y="181" text-anchor="middle" class="lbl" font-family="Georgia,'Times New Roman',serif" font-size="11px" fill="#C0B69F">preview again</text>
<path d="M638 101V139" class="arr dash" stroke="#C0B69F" stroke-width="1.4" fill="none" marker-end="url(#a)" stroke-dasharray="4 3"/>
<rect x="564" y="142" width="148" height="46" rx="2" class="box dash" fill="none" stroke="#665C47" stroke-width="1" stroke-dasharray="4 3"/><text x="638" y="162" text-anchor="middle" class="ttl dash" font-family="Georgia,'Times New Roman',serif" font-size="13px" font-weight="600" fill="#F3E8CD">Undo any time</text><text x="638" y="179" text-anchor="middle" class="sub mono" font-family="ui-monospace,SFMono-Regular,&quot;Cascadia Mono&quot;,Consolas,Menlo,monospace" font-size="11.5px" fill="#C0B69F">/zeit-undo</text>
</svg>
