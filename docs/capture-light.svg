<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="How edits and shell commands are protected">
<title>How edits and shell commands are protected</title>
<style>svg{--fg:#1f2328;--muted:#656d76;--box:#f6f8fa;--line:#d0d7de;--acc:#bc5a34;--accbg:#fbeee8;--ok:#1a7f37;--okbg:#dafbe1;--bad:#cf222e;--badbg:#ffebe9;--page:#ffffff}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.box{fill:var(--box);stroke:var(--line);stroke-width:1}
.box.acc{fill:var(--accbg);stroke:var(--acc)}
.box.ok{fill:var(--okbg);stroke:var(--ok)}
.box.bad{fill:var(--badbg);stroke:var(--bad)}
.box.dash{fill:none;stroke-dasharray:4 3}
.ttl{font-size:13px;font-weight:600;fill:var(--fg)}
.ttl.ok{fill:var(--ok)}.ttl.bad{fill:var(--bad)}.ttl.acc{fill:var(--acc)}
.sub{font-size:11.5px;fill:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,Menlo,monospace}
.lane{font-size:11px;font-weight:600;letter-spacing:.09em;fill:var(--muted)}
.lbl{font-size:11px;fill:var(--muted)}
.lbl.acc{fill:var(--acc)}.lbl.bad{fill:var(--bad)}.lbl.ok{fill:var(--ok)}
.arr{stroke:var(--muted);stroke-width:1.4;fill:none;marker-end:url(#a)}
.arr.acc{stroke:var(--acc);marker-end:url(#aa)}
.arr.bad{stroke:var(--bad);marker-end:url(#ab)}
.arr.dash{stroke-dasharray:4 3}
.ah{fill:var(--muted)}.ah.acc{fill:var(--acc)}.ah.bad{fill:var(--bad)}
.axis{stroke:var(--line);stroke-width:2}
.dot{fill:var(--page);stroke:var(--muted);stroke-width:2}
.dot.ok{fill:var(--ok);stroke:var(--ok)}
.dot.acc{fill:var(--acc);stroke:var(--acc)}
.dot.dash{stroke-dasharray:3 2}
.halo{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.45}
.check{stroke:var(--page);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="ah "/></marker><marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="ah acc"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" class="ah bad"/></marker></defs>
<text x="40" y="28" text-anchor="start" class="lane">FILE EDITS</text>
<rect x="40" y="42" width="170" height="60" rx="8" class="box "/><text x="125" y="69" text-anchor="middle" class="ttl ">Agent edits a file</text><text x="125" y="86" text-anchor="middle" class="sub">Edit, Write, MultiEdit</text>
<path d="M212 72H247" class="arr "/>
<rect x="250" y="42" width="170" height="60" rx="8" class="box acc"/><text x="335" y="69" text-anchor="middle" class="ttl acc">Save its content first</text><text x="335" y="86" text-anchor="middle" class="sub">once per file per turn</text>
<path d="M422 72H457" class="arr "/>
<rect x="460" y="42" width="170" height="60" rx="8" class="box "/><text x="545" y="69" text-anchor="middle" class="ttl ">Permission, then edit</text><text x="545" y="86" text-anchor="middle" class="sub">the edit runs as usual</text>
<path d="M632 72H667" class="arr "/>
<rect x="670" y="42" width="170" height="60" rx="8" class="box ok"/><text x="755" y="69" text-anchor="middle" class="ttl ok">Protected</text><text x="755" y="86" text-anchor="middle" class="sub">a rollback restores it</text>
<path d="M545 103V129" class="arr "/>
<text x="553" y="120" text-anchor="start" class="lbl">refused</text>
<rect x="460" y="132" width="170" height="34" rx="8" class="box "/><text x="545" y="153.5" text-anchor="middle" class="ttl ">Save dropped</text>
<text x="40" y="206" text-anchor="start" class="lane">SHELL COMMANDS</text>
<rect x="40" y="220" width="170" height="60" rx="8" class="box "/><text x="125" y="247" text-anchor="middle" class="ttl ">Agent runs a command</text><text x="125" y="264" text-anchor="middle" class="sub">Bash or PowerShell</text>
<path d="M212 250H247" class="arr "/>
<rect x="250" y="220" width="170" height="60" rx="8" class="box "/><text x="335" y="247" text-anchor="middle" class="ttl ">Looks destructive?</text><text x="335" y="264" text-anchor="middle" class="sub">rm, mv, git reset, sed -i</text>
<path d="M422 250H457" class="arr "/>
<rect x="460" y="220" width="170" height="60" rx="8" class="box acc"/><text x="545" y="247" text-anchor="middle" class="ttl acc">Snapshot first</text><text x="545" y="264" text-anchor="middle" class="sub">bounded: 5,000 files</text>
<path d="M632 250H667" class="arr "/>
<rect x="670" y="220" width="170" height="60" rx="8" class="box "/><text x="755" y="247" text-anchor="middle" class="ttl ">Command runs</text><text x="755" y="264" text-anchor="middle" class="sub">shown above the prompt</text>
<text x="438" y="241" text-anchor="middle" class="lbl">yes</text>
<path d="M335 281C335 322 755 322 755 284" class="arr "/>
<text x="545" y="325" text-anchor="middle" class="lbl">no</text>
</svg>
